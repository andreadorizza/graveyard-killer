[project]
name = "graveyard-killer"
version = "0.1.0"
description = "Development tooling for the graveyard-killer skill's scripts."
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "distlib>=0.3.9; sys_platform == 'win32'", "pyyaml>=6", "types-pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real tools and the network; run with -m live"]
addopts = "-m 'not live'"

[tool.mypy]
strict = true
files = ["plugin/skills/graveyard-killer/scripts", "tests", "evals"]

[[tool.mypy.overrides]]
# Windows-only test dependency with no type hints: absent on macOS and Linux, untyped on Windows.
module = ["distlib.*"]
ignore_missing_imports = true
